[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "command-execution"
version = "2.0.9"
description = "Independent configured command and configuration APIs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonpatch>=1.36",
    "jsonpointer>=3.4",
]

[project.scripts]
command-execution = "command_execution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
