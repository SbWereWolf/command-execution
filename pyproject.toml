[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "command-execution"
version = "1.0.1"
description = "Independent configured command and configuration APIs"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
dependencies = [
    "jsonpatch>=1.36",
    "jsonpointer>=3.4",
]

[project.urls]
Documentation = "https://github.com/SbWereWolf/command-execution/blob/v1.0.1/docs/usage.md"
Source = "https://github.com/SbWereWolf/command-execution"

[tool.setuptools.packages.find]
where = ["src"]
