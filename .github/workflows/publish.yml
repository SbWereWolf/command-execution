name: Publish command-execution
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Check tag, metadata and release behavior
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -I -B tests/test_release_contract.py -v
          python -I -B .github/scripts/release.py validate --tag "$RELEASE_TAG"
      - name: Build wheel from the selected commit
        run: |
          python -m pip install build setuptools wheel
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: python -m build --wheel --no-isolation
      - name: Check wheel metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Check the installed public API and actual subprocess
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install dist/*.whl packaging
          mkdir "$RUNNER_TEMP/command-contract"
          python -I -B tests/fixtures/command-package/check_installed.py "$RELEASE_TAG" "$RUNNER_TEMP/command-contract"
      - name: Refuse conflicting releases and recognize exact replay
        id: registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -I -B .github/scripts/release.py registry --tag "$RELEASE_TAG"
      - name: Publish through the configured PyPI trusted publisher
        if: steps.registry.outputs.decision == 'publish'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Verify registry bytes after publication or exact replay
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -I -B .github/scripts/release.py verify --tag "$RELEASE_TAG"

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/
      - name: Use the release version of npm
        run: npm install --global npm@11.21.3
      - name: Build and test the npm tarball
        run: |
          python -I -B .github/scripts/release.py validate --tag "$RELEASE_TAG"
          python -I -B .github/scripts/npm-release.py pack --tag "$RELEASE_TAG"
          python -I -B .github/scripts/npm-release.py smoke --tag "$RELEASE_TAG"
      - name: Check npm for an identical release
        id: npm-registry
        run: |
          decision=$(python -I -B .github/scripts/npm-release.py registry --tag "$RELEASE_TAG")
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
      - name: Publish to npm through the trusted publisher
        if: steps.npm-registry.outputs.decision == 'publish'
        run: npm publish "dist/npm/command-execution-${RELEASE_TAG#v}.tgz" --access public
      - name: Verify npm tarball after upload or exact replay
        run: python -I -B .github/scripts/npm-release.py verify --tag "$RELEASE_TAG"
