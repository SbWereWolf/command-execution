name: Publish command-execution
on:
  push:
    tags: ['v*', 'qualify-ce-v*-npm-outage', 'qualify-ce-v*-pypi-outage']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    uses: ./.github/workflows/reusable-release.yml
    permissions:
      contents: read
      id-token: write
    with:
      channel: npm
      mode: ${{ startsWith(github.ref_name, 'qualify-') && 'qualification' || 'production' }}
      package: ${{ vars.RELEASE_PACKAGE || 'command-execution' }}
      driver: ${{ vars.RELEASE_DRIVER || '.github/scripts/release-channel.sh' }}
      python_version: ${{ vars.RELEASE_PYTHON_VERSION || '3.15' }}
      node_version: ${{ vars.RELEASE_NODE_VERSION || '24' }}
      npm_version: ${{ vars.RELEASE_NPM_VERSION || '11.21.3' }}
      npm_environment: ${{ vars.RELEASE_NPM_ENVIRONMENT }}

  pypi:
    uses: ./.github/workflows/reusable-release.yml
    with:
      channel: pypi
      mode: ${{ startsWith(github.ref_name, 'qualify-') && 'qualification' || 'production' }}
      package: ${{ vars.RELEASE_PACKAGE || 'command-execution' }}
      driver: ${{ vars.RELEASE_DRIVER || '.github/scripts/release-channel.sh' }}
      python_version: ${{ vars.RELEASE_PYTHON_VERSION || '3.15' }}

  publish_pypi:
    name: Publish PyPI distribution
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_MODE: production
      RELEASE_PACKAGE: ${{ vars.RELEASE_PACKAGE || 'command-execution' }}
      RELEASE_DRIVER: ${{ vars.RELEASE_DRIVER || '.github/scripts/release-channel.sh' }}
      RELEASE_REF_NAME: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.RELEASE_PYTHON_VERSION || '3.15' }}
      - uses: actions/download-artifact@v4
        with:
          name: release-pypi
          path: ${{ runner.temp }}/release-dist
      - name: Check artifact and publication status
        id: registry
        run: |
          [[ $RELEASE_DRIVER == .github/scripts/* && $RELEASE_DRIVER != *..* ]]
          path="$RUNNER_TEMP/release-dist"
          artifact=$(bash "$RELEASE_DRIVER" artifact pypi "$path")
          decision=$(bash "$RELEASE_DRIVER" registry pypi "$path")
          [[ $decision == publish || $decision == already-published ]]
          mkdir "$RUNNER_TEMP/pypi-upload"
          cp -- "$artifact" "$RUNNER_TEMP/pypi-upload/"
          printf 'decision=%s\n' "$decision" >> "$GITHUB_OUTPUT"
      - name: Publish through PyPI Trusted Publishing
        if: steps.registry.outputs.decision == 'publish'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/pypi-upload/
      - name: Verify registry bytes after publication or exact replay
        run: bash "$RELEASE_DRIVER" verify pypi "$RUNNER_TEMP/release-dist"
